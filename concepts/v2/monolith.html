<style>
:root{
  /* Layout: a full-bleed WebGL void. UI lives only in the four corners and on the face of whichever slab is turned toward you. */
  --void:#050505;
  --stone:#ebe5da;
  --stone-2:#a8a297;
  --stone-3:#6e6961;
  --warm:#ffb46b;
  --line:rgba(235,229,218,.16);
  --ui:"Archivo",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);color:var(--stone);overflow:hidden;font-family:var(--ui);-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
body.hover #gl{cursor:pointer}
.veil{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}
.grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.05;background-size:180px 180px;animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{background-position:0 0}20%{background-position:-37px 23px}40%{background-position:29px -51px}60%{background-position:-61px -17px}80%{background-position:43px 41px}100%{background-position:0 0}}

.corner{position:fixed;z-index:6;font:500 11px/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--stone-2)}
.tl{top:22px;left:26px}.tr{top:22px;right:26px}.bl{bottom:22px;left:26px}.br{bottom:22px;right:26px;text-align:right}
.name,.tr button{appearance:none;background:none;border:0;padding:0;margin:0;color:var(--stone);cursor:pointer;font:600 14px/1 var(--ui);font-stretch:125%;letter-spacing:.2em;text-transform:uppercase}
.tr button{font:500 11px/1 var(--mono);letter-spacing:.16em;color:var(--stone-2);padding:6px 0;border-bottom:1px solid var(--line)}
.tr button:hover,.name:hover{color:#fff}
.bl b{font-weight:500;color:var(--stone);margin-right:10px}
.br small{display:block;color:var(--stone-3);font-size:10px;letter-spacing:.1em;margin-top:4px}
button:focus-visible,input:focus-visible+span,label:focus-within{outline:1px solid var(--warm);outline-offset:4px}

.panel{position:fixed;left:0;top:0;width:10px;height:10px;z-index:4;container-type:size;opacity:0;pointer-events:none;transition:opacity .45s ease;will-change:transform}
.panel.show{opacity:1;pointer-events:auto}
.pin{position:absolute;inset:0;padding:9cqw 9cqw 17cqh;display:flex;flex-direction:column;overflow:auto;scrollbar-width:none;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.pin::-webkit-scrollbar{display:none}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 max(10px,3.3cqw)/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--stone-2)}
.back{appearance:none;background:none;border:0;padding:4px 0;color:var(--stone);font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
.back:hover{color:#fff}
.p-title{font:700 16cqw/.88 var(--ui);font-stretch:66%;letter-spacing:.005em;text-transform:uppercase;margin:8cqh 0 0;text-wrap:balance}
.p-list{list-style:none;margin:auto 0 0;padding:0;border-top:1px solid var(--line)}
.p-list button{appearance:none;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;text-align:left;width:100%;cursor:pointer;display:grid;grid-template-columns:9cqw minmax(0,1fr);gap:2cqw;padding:4cqw 0;transition:padding .35s cubic-bezier(.2,.8,.2,1)}
.p-list button:hover,.p-list button:focus-visible{padding-left:2.5cqw}
.i-n{font:500 max(10px,3.2cqw)/1.7 var(--mono);color:var(--stone-3)}
.i-t{display:block;font:600 max(15px,7.2cqw)/1.04 var(--ui);font-stretch:84%;color:var(--stone)}
.i-l{display:block;font:400 max(12px,4.2cqw)/1.35 var(--ui);color:var(--stone-2);margin-top:1.4cqw}
.i-m{display:block;font:500 max(10px,3.1cqw)/1.4 var(--mono);letter-spacing:.04em;color:var(--warm);margin-top:1.8cqw}
.p-list button:hover .i-t{color:#fff}
.d-kick{margin-top:8cqh;font:500 max(10px,3.2cqw)/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--warm)}
.d-title{font:700 14cqw/.9 var(--ui);font-stretch:66%;text-transform:uppercase;margin:3cqw 0 6cqw;text-wrap:balance}
.d-title.long{font-size:10.5cqw}
.d-desc{font:400 max(13px,4.5cqw)/1.5 var(--ui);color:var(--stone);margin:0}
.d-stats{margin:auto 0 0;border-top:1px solid var(--line)}
.d-stats div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:3cqw 0;border-bottom:1px solid var(--line)}
.d-stats dt{font:500 max(10px,3cqw)/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--stone-3)}

.d-link{margin-top:5cqw;font:500 max(10px,3.3cqw)/1 var(--mono);letter-spacing:.06em;color:var(--stone-2)}

.about.show{opacity:1;pointer-events:auto;transform:translateY(-50%)}
.a-kick{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--stone-3)}

.a-bio{font:400 17px/1.55 var(--ui);color:var(--stone);margin:0;min-height:6.2em;max-width:36ch;transition:opacity .18s}
.a-bio.tick{opacity:.35}
.tars{margin-top:22px;padding:16px 16px 14px;border:1px solid #2b2926;border-radius:5px;background:linear-gradient(#151514,#0d0d0c);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 24px 48px -24px #000;
  background-image:radial-gradient(circle at 8px 8px,#3d3a36 1.6px,transparent 2.2px),radial-gradient(circle at calc(100% - 8px) 8px,#3d3a36 1.6px,transparent 2.2px),radial-gradient(circle at 8px calc(100% - 8px),#3d3a36 1.6px,transparent 2.2px),radial-gradient(circle at calc(100% - 8px) calc(100% - 8px),#3d3a36 1.6px,transparent 2.2px),linear-gradient(#151514,#0d0d0c)}
.t-head{display:flex;justify-content:space-between;font:500 9.5px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--stone-3);margin:0 6px 16px}
.t-head i{font-style:normal;color:#7fd29a}
.t-row{display:flex;justify-content:space-between;align-items:center;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--stone-2);margin:0 2px}
.t-row output{font:500 14px/1 var(--mono);letter-spacing:.06em;color:var(--warm);text-shadow:0 0 10px rgba(255,170,90,.5);background:#070605;border:1px solid #241e18;border-radius:3px;padding:5px 7px;font-variant-numeric:tabular-nums}
.t-ctl{margin:4px 0 14px}
.t-ctl:last-of-type{margin-bottom:6px}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:30px;margin:0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#050505;border:1px solid #1f1d1b;box-shadow:inset 0 1px 3px #000,0 1px 0 rgba(255,255,255,.05)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:26px;margin-top:-11px;border-radius:2px;border:0;background:linear-gradient(90deg,#7f786e,#d4cdc1 40%,#f1ebdf 50%,#d4cdc1 60%,#7f786e);box-shadow:0 3px 7px rgba(0,0,0,.75),inset 0 0 0 1px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#050505;border:1px solid #1f1d1b;box-shadow:inset 0 1px 3px #000}
input[type=range]::-moz-range-thumb{width:14px;height:26px;border-radius:2px;border:0;background:linear-gradient(90deg,#7f786e,#d4cdc1 40%,#f1ebdf 50%,#d4cdc1 60%,#7f786e);box-shadow:0 3px 7px rgba(0,0,0,.75)}
input[type=range]:focus-visible{outline:1px solid var(--warm);outline-offset:3px}
.ticks{display:flex;justify-content:space-between;margin:0 7px;height:7px}
.ticks span{width:1px;height:4px;background:#3e3a35}
.ticks span:nth-child(5n+1){height:7px;background:#5a554e}
.t-note{min-height:14px;font:500 10px/1.4 var(--mono);letter-spacing:.08em;color:var(--warm);margin:8px 2px 0}
.photo{display:inline-flex;align-items:center;gap:10px;margin-top:18px;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--stone);cursor:pointer;padding:10px 14px;border:1px solid var(--line);border-radius:3px;transition:border-color .2s,color .2s}
.photo:hover{border-color:var(--stone-2);color:#fff}
.photo input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.a-fine{font:400 12px/1.5 var(--mono);color:var(--stone-3);margin:12px 0 0;max-width:38ch}

.drop{position:fixed;inset:14px;z-index:9;border:1px dashed var(--warm);border-radius:12px;display:grid;place-items:center;font:500 12px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--warm);background:rgba(5,5,5,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.drop.on{opacity:1}
.loader{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:var(--void);font:500 11px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--stone-3);transition:opacity .9s ease}
.loader.out{opacity:0;pointer-events:none}
.sr{position:fixed;left:50%;bottom:22px;z-index:7;display:flex;gap:6px;transform:translateX(-50%);clip-path:inset(50%);opacity:0}
.sr:focus-within{clip-path:none;opacity:1}
.sr button{appearance:none;background:#0d0d0c;border:1px solid var(--line);color:var(--stone);font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:9px 12px;border-radius:3px;cursor:pointer}
#fallback{position:fixed;inset:0;overflow:auto;padding:80px 26px;z-index:7;background:var(--void)}
#fallback h1{font:700 64px/.9 var(--ui);font-stretch:64%;text-transform:uppercase;margin:0 0 40px}
#fallback h2{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--stone-3);margin:32px 0 12px}
#fallback p{margin:6px 0;color:var(--stone-2)}

@media (max-width:760px){
  .tl{top:18px;left:18px}.tr{top:18px;right:18px}.bl{bottom:18px;left:18px}.br{bottom:18px;right:18px}
  .name{font-size:12px;letter-spacing:.16em}
  .br{max-width:44vw}
  .about{left:14px;right:14px;width:auto;top:auto;bottom:64px;max-height:52vh;overflow:auto;transform:translateY(14px);background:rgba(6,6,6,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:8px;padding:18px}
  .about.show{transform:none}
  body.m-about .br{display:none}
  .a-title{font-size:40px;margin:10px 0 12px}
  .a-bio{font-size:15px;min-height:0}
}
@media (prefers-reduced-motion:reduce){.grain{animation:none}*{transition-duration:.01ms!important}}
</style>

<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="veil"></div>
<div class="grain" id="grain"></div>

<div class="corner tl"><button class="name" id="home" type="button">Scott Moss</button></div>
<div class="corner tr"><button id="aboutBtn" type="button">About</button></div>
<div class="corner bl" id="where"><b>00</b>Index</div>
<div class="corner br"><span id="hint">Move to light the stone · Click a slab</span><small>Placeholder projects, numbers and portrait</small></div>

<div class="panel" id="panel"></div>

<aside class="about" id="about" aria-label="About">
  <div class="a-kick">About · in relief</div>
  <h2 class="a-title">Scott Moss</h2>
  <p class="a-bio" id="bio"></p>
  <div class="tars">
    <div class="t-head"><span>Settings</span><span><i>●</i> Calibrated</span></div>
    <div class="t-row"><label for="honesty">Honesty</label><output id="ho" for="honesty">090%</output></div>
    <div class="t-ctl"><input type="range" id="honesty" min="0" max="100" step="5" value="90"><div class="ticks"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
    <div class="t-row"><label for="humor">Humor</label><output id="hu" for="humor">075%</output></div>
    <div class="t-ctl"><input type="range" id="humor" min="0" max="100" step="5" value="75"><div class="ticks"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
    <div class="t-note" id="tnote"></div>
  </div>
  <label class="photo"><input type="file" id="file" accept="image/*">Use your photo</label>
  <p class="a-fine">Drop a photo anywhere to carve it into the stone. It never leaves your browser.</p>
</aside>

<nav class="sr" aria-label="Sections">
  <button type="button" data-k="0">1 Apps</button><button type="button" data-k="1">2 Open source</button><button type="button" data-k="2">3 Research</button><button type="button" data-k="3">4 Video</button><button type="button" data-k="about">About</button>
</nav>

  function outerBack(g, d) {
    const cs = [[-W / 2, -T / 2], [W / 2, -T / 2], [-W / 2, T / 2], [W / 2, T / 2]].map(([x, z]) => new V3(x, 0, z).applyAxisAngle(Y, g.rotation.y).add(g.position));
    cs.sort((a, b) => (Math.round(d * b.x * 1e4) - Math.round(d * a.x * 1e4)) || (a.z - b.z));
    return cs[0];
  }

  /* state */
  let mode = 'home', cur = -1, curItem = -1, busy = false, camState = 'home', hovered = -1;
  const panel = $('#panel'), about = $('#about');
  let panelBack = false;
  const camPos = new V3(), camTgt = new V3(), want = { pos: new V3(), tgt: new V3() };

  function camFor(st) {
    const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2), th = tv * camera.aspect;
    const fit = (cx, cy, cz, fh, fw, ox = 0, oy = 0) => { const dist = Math.max(H / (fh * 2 * tv), W / (fw * 2 * th)); return [new V3(cx + ox, cy + oy + .03, cz + dist), new V3(cx + ox, cy + oy, cz)]; };
    if (st === 'home') {
      if (narrow) return [new V3(-2.9, 1.45, 7.2), new V3(.25, .86, -.3)];
      const span = 4 * W + 3 * GAP + .9;
      const dist = Math.max(H / (.5 * 2 * tv), span / (.86 * 2 * th));
      return [new V3(0, 1.1, dist), new V3(0, .88, 0)];
    }
    if (st === 'section') return fit(0, H / 2, SEL_Z + T / 2, .74, .84);
    if (st === 'detail') return fit(0, H / 2, SEL_Z + T / 2, .86, .92);
    if (st === 'about') {
      if (narrow) { const dist = Math.max(H / (.34 * 2 * tv), W / (.62 * 2 * th)), oy = -.52 * dist * tv; return [new V3(0, H / 2 + oy + .03, PORTRAIT_Z + T / 2 + dist), new V3(0, H / 2 + oy, PORTRAIT_Z + T / 2)]; }
      const dist = Math.max(H / (.74 * 2 * tv), W / (.3 * 2 * th));
      const ox = dist * th * .44;
      return [new V3(ox, H / 2 + .03, PORTRAIT_Z + T / 2 + dist), new V3(ox, H / 2, PORTRAIT_Z + T / 2)];
    }
  }
  function setWant() { const [p, t] = camFor(camState); want.pos.copy(p); want.tgt.copy(t); }

  function setCorner() {
    const w = $('#where'), h = $('#hint');
    if (mode === 'home') { w.innerHTML = '<b>00</b>Index'; h.textContent = coarse ? 'Tap a slab' : 'Move to light the stone · Click a slab'; }
    if (mode === 'section') { w.innerHTML = '<b>' + pad(cur + 1) + '</b>' + DATA[cur].name; h.textContent = 'Select a project · Esc to step back'; }
    if (mode === 'detail') { w.innerHTML = '<b>' + pad(cur + 1) + '</b>' + DATA[cur].name + ' / ' + DATA[cur].items[curItem].t; h.textContent = 'Esc to step back'; }
    if (mode === 'about') { w.innerHTML = '<b>—</b>About'; h.textContent = 'Drop a photo to carve it'; }
    $('#aboutBtn').textContent = mode === 'about' ? 'Close' : 'About';
    document.body.classList.toggle('m-about', mode === 'about');
  }
  function hidePanel() { panel.classList.remove('show'); }
  function showPanel(html, back) {
    panel.innerHTML = '<div class="pin">' + html + '</div>';
    panelBack = back;
    placePanel();
    requestAnimationFrame(() => panel.classList.add('show'));
  }
  function sectionHTML(k) {
    const s = DATA[k];
    return '<div class="p-head"><button class="back" type="button" data-act="home">← Index</button><span>' + pad(k + 1) + ' / 04</span></div>' +
      '<h2 class="p-title">' + s.name + '</h2>' +
      '<ol class="p-list">' + s.items.map((it, j) => '<li><button type="button" data-j="' + j + '"><span class="i-n">' + pad(j + 1) + '</span><span><span class="i-t">' + it.t + '</span><span class="i-l">' + it.line + '</span><span class="i-m">' + it.meta + '</span></span></button></li>').join('') + '</ol>';
  }
  function detailHTML(k, j) {
    const s = DATA[k], it = s.items[j];
    return '<div class="p-head"><button class="back" type="button" data-act="section">← ' + s.name + '</button><span>' + pad(j + 1) + ' / ' + pad(s.items.length) + '</span></div>' +
      '<div class="d-kick">' + it.kind + '</div><h2 class="d-title' + (it.t.length > 16 ? ' long' : '') + '">' + it.t + '</h2>' +
      '<p class="d-desc">' + it.desc + '</p>' +
      '<dl class="d-stats">' + it.stats.map(([a, b]) => '<div><dt>' + a + '</dt><dd>' + b + '</dd></div>').join('') + '</dl>' +
      '<div class="d-link">' + it.link + '</div>';
  }
  function placePanel() {
    if (cur < 0) return;
    const m = slabs[cur].userData.mesh;
    m.updateWorldMatrix(true, false);
    const z = panelBack ? -T / 2 - .001 : T / 2 + .001;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
      _v.set(sx * W / 2, sy * H / 2, z).applyMatrix4(m.matrixWorld).project(camera);
      const px = (_v.x * .5 + .5) * innerWidth, py = (-_v.y * .5 + .5) * innerHeight;
      x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py);
    }
    panel.style.transform = 'translate(' + x0.toFixed(1) + 'px,' + y0.toFixed(1) + 'px)';
    panel.style.width = (x1 - x0).toFixed(1) + 'px';
    panel.style.height = (y1 - y0).toFixed(1) + 'px';
  }

  async function openSection(k) {
    if (busy || mode !== 'home') return;
    busy = true; mode = 'section'; cur = k; hovered = -1; document.body.classList.remove('hover');
    setCorner();
    const jobs = [];
    slabs.forEach((g, i) => {
      if (i === k) return;
      const d = Math.sign(i - k), dist = Math.abs(i - k);
      jobs.push((async () => {
        await wait(40 + dist * 110);
        await swing(g, outerBack(g, d), -d * Math.PI / 2, 600);
        await slide(g, g.position.clone().add(new V3(d * (.3 + dist * .28), 0, -1.25 - dist * .3)), g.rotation.y, 860);
        thud(.25);
      })());
    });
    jobs.push((async () => {
      await wait(360);
      camState = 'section'; setWant();
      await slide(slabs[k], new V3(0, 0, SEL_Z), 0, 1000);
      thud(.7);
    })());
    await Promise.all(jobs);
    showPanel(sectionHTML(k), false);
    busy = false;
  }
  async function openDetail(j) {
    if (busy || mode !== 'section') return;
    busy = true; hidePanel(); curItem = j; mode = 'detail'; setCorner();
    const g = slabs[cur];
    await wait(180);
    camState = 'detail'; setWant();
    await slide(g, g.position.clone(), g.rotation.y + Math.PI, 1150);
    thud(.5);
    showPanel(detailHTML(cur, j), true);
    busy = false;
  }
  async function closeDetail() {
    if (busy || mode !== 'detail') return;
    busy = true; hidePanel(); mode = 'section'; setCorner();
    camState = 'section'; setWant();
    await rewindOne(slabs[cur]);
    thud(.5);
    showPanel(sectionHTML(cur), false);
    busy = false;
  }
  async function toHome() {
    if (busy || mode === 'home') return;
    busy = true; hidePanel(); about.classList.remove('show');
    const wasAbout = mode === 'about', k = cur;
    mode = 'home'; setCorner();
    camState = 'home'; setWant();
    const jobs = [];
    if (wasAbout) jobs.push(slide(portrait, new V3(0, 0, -9), 0, 1100, false));
    slabs.forEach((g, i) => jobs.push(rewind(g, i === k ? 0 : (wasAbout ? 420 : 260 + Math.abs(i - k) * 90))));
    await Promise.all(jobs);
    thud(.4);
    cur = -1; curItem = -1;
    busy = false;
  }
  async function openAbout() {
    if (busy) return;
    if (mode !== 'home') { await toHome(); if (busy) return; }
    busy = true; mode = 'about'; hovered = -1; setCorner();
    const jobs = slabs.map((g, i) => (async () => {
      const d = i < 2 ? -1 : 1, dist = i < 2 ? 2 - i : i - 1;
      await wait(dist === 1 ? 40 : 160);
      await swing(g, outerBack(g, d), -d * Math.PI / 2, 620);
      await slide(g, g.position.clone().add(new V3(d * (.45 + dist * .3), 0, -.9 - dist * .25)), g.rotation.y, 820);
    })());
    jobs.push((async () => {
      await wait(520);
      camState = 'about'; setWant();
      await slide(portrait, new V3(0, 0, PORTRAIT_Z), 0, 1500, false);
      thud(.9);
    })());
    await Promise.all(jobs);
    about.classList.add('show');
    busy = false;
  }

  /* bio controls */
  const hon = $('#honesty'), hum = $('#humor'), bio = $('#bio');
  function renderBio(flash) {
    const hu = +hum.value, ho = +hon.value;
    $('#hu').value = $('#hu').textContent = String(hu).padStart(3, '0') + '%';
    $('#ho').value = $('#ho').textContent = String(ho).padStart(3, '0') + '%';
    const text = HUMOR[Math.min(4, Math.floor(hu / 20))] + ' ' + HONEST[ho >= 50 ? 1 : 0];
    $('#tnote').textContent = hu === 100 ? 'Humor at 100% is not recommended.' : ho === 100 ? 'Absolute honesty is not always the most diplomatic.' : ho < 30 ? 'Low honesty mode. Results may be flattering.' : '';
    if (bio.textContent === text) return;
    if (flash && !reduce) { bio.classList.add('tick'); setTimeout(() => { bio.textContent = text; bio.classList.remove('tick'); }, 140); }
    else bio.textContent = text;
  }
  hon.addEventListener('input', () => renderBio(true));
  hum.addEventListener('input', () => renderBio(true));
  renderBio(false);

  /* photo */
  function loadFile(f) {
    if (!f || !/^image\//.test(f.type)) return;
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => { applyPortrait(img); if (mode !== 'about') openAbout(); };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  }
  $('#file').addEventListener('change', e => loadFile(e.target.files[0]));
  const drop = $('#drop');
  let dragDepth = 0;
  addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; drop.classList.add('on'); });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) drop.classList.remove('on'); });
  addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; drop.classList.remove('on'); loadFile(e.dataTransfer.files[0]); });

  /* input */
  const pointer = new THREE.Vector2(0, 0), ndc = new THREE.Vector2();
  let mx = .55, my = .25, lastMove = -1e9;
  const ray = new THREE.Raycaster();
  const hitSlab = (cx, cy) => {
    ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(slabs.map(g => g.userData.mesh), false)[0];
    return hit ? hit.object.userData.k : -1;
  };
  addEventListener('pointermove', e => {
    pointer.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    lastMove = performance.now();
    if (e.pointerType === 'mouse' && mode === 'home' && !busy && e.target.id === 'gl') {
      hovered = hitSlab(e.clientX, e.clientY);
      document.body.classList.toggle('hover', hovered >= 0);
    } else if (mode !== 'home') { hovered = -1; document.body.classList.remove('hover'); }
  });
  $('#gl').addEventListener('click', e => {
    pointer.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    lastMove = performance.now();
    if (mode !== 'home' || busy) return;
    const k = hitSlab(e.clientX, e.clientY);
    if (k >= 0) openSection(k);
  });
  panel.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.act === 'home') toHome();
    else if (b.dataset.act === 'section') closeDetail();
    else if (b.dataset.j != null) openDetail(+b.dataset.j);
  });
  $('#home').addEventListener('click', () => toHome());
  $('#aboutBtn').addEventListener('click', () => mode === 'about' ? toHome() : openAbout());
  document.querySelectorAll('.sr button').forEach(b => b.addEventListener('click', async () => {
    if (b.dataset.k === 'about') return openAbout();
    if (mode !== 'home') await toHome();
    openSection(+b.dataset.k);
  }));
  addEventListener('keydown', e => {
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName) && e.target.type !== 'range') return;
    if (e.key === 'Escape') { if (mode === 'detail') closeDetail(); else if (mode !== 'home') toHome(); }
    if (mode === 'home' && /^[1-4]$/.test(e.key)) openSection(+e.key - 1);
  });

  /* resize */
  function resize() {
    const wasNarrow = narrow;
    narrow = innerWidth / innerHeight < .8 || innerWidth < 640;
    GAP = narrow ? .16 : .38;
    camera.aspect = innerWidth / innerHeight;
    camera.fov = narrow ? 42 : 34;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight, false);
    if (reflector) reflector.getRenderTarget().setSize(innerWidth * DPR * .5, innerHeight * DPR * .5);
    if (wasNarrow !== narrow && mode === 'home' && !busy) slabs.forEach((g, i) => { if (!g.userData.path.length) g.position.x = homeX(i); });
    setWant();
  }
  addEventListener('resize', resize);

  /* loop */
  setWant();
  camPos.copy(want.pos).add(new V3(0, .35, 2.2));
  camTgt.copy(want.tgt);
  setCorner();
  let last = performance.now(), raf = 0;
  const lp = new V3(), tmp = new V3();
  function frame(t) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    runTweens(t);
    const idle = coarse || t - lastMove > 5000;
    if (idle && !reduce) { mx += (Math.sin(t * .00023) * .85 - mx) * .02; my += (.25 + Math.sin(t * .00017) * .45 - my) * .02; }
    else if (!idle) { mx += (pointer.x - mx) * Math.min(1, dt * 5); my += (pointer.y - my) * Math.min(1, dt * 5); }
    const k = reduce ? 1 : 1 - Math.exp(-dt * 2.6);
    tmp.copy(want.pos);
    if (camState === 'home' && !narrow) tmp.x += mx * .18, tmp.y += my * .06;
    camPos.lerp(tmp, k); camTgt.lerp(want.tgt, k);
    shake *= Math.exp(-dt * 16);
    camera.position.copy(camPos); camera.position.y += Math.sin(t * .09) * shake;
    camera.lookAt(camTgt);
    const onFace = mode === 'section' || mode === 'detail';
    if (onFace) lp.set(camTgt.x + (mx >= 0 ? 1 : -1) * 1.5 + mx * .9, .6 + (my * .5 + .5) * 1.6, camTgt.z + .75);
    else lp.set(camTgt.x + mx * 2.7, .55 + (my * .5 + .5) * 1.9, camTgt.z + 1.7);
    spot.position.lerp(lp, Math.min(1, dt * 4));
    spot.intensity += ((onFace ? 30 : 70) - spot.intensity) * Math.min(1, dt * 3);
    spot.target.position.lerp(camTgt, Math.min(1, dt * 4));
    slabs.forEach((g, i) => { const m = g.userData.mesh, want_ = mode === 'home' && hovered === i ? .07 : 0; m.position.z += (want_ - m.position.z) * Math.min(1, dt * 8); });
    const pa = dGeo.attributes.position.array;
    for (let i = 0; i < dustN; i++) {
      pa[i * 3 + 1] -= dt * (.018 + (dSeed[i] % 1) * .02);
      pa[i * 3] += Math.sin(t * .0004 + dSeed[i]) * dt * .02;
      if (pa[i * 3 + 1] < 0) pa[i * 3 + 1] = 3;
    }
    dGeo.attributes.position.needsUpdate = true;
    if (panel.classList.contains('show')) placePanel();
    renderer.render(scene, camera);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
    else if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
  });
  raf = requestAnimationFrame(frame);
  requestAnimationFrame(() => $('#loader').classList.add('out'));
  window.__monolith = { openSection, openDetail, openAbout, toHome, state: () => ({ mode, cur, busy }) };
}
</script>
</body>
</html>
